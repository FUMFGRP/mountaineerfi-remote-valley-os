name: Deploy to Netlify

# Auto-deploys the site to Netlify on every push to main.
# Requires two repository secrets (Settings → Secrets and variables → Actions):
#   NETLIFY_AUTH_TOKEN — Netlify personal access token
#   NETLIFY_SITE_ID    — Netlify site ID (Site settings → General)
# Never commit tokens to the repo.

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build and deploy to Netlify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Netlify
        uses: netlify/actions/cli@master
        with:
          args: deploy --dir=dist --prod
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
